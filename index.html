<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallpaper Upload</title>
  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/supabase.min.js"></script>
</head>
<body>
  <div class="container">
    <h1 class="title">Upload Your Wallpapers</h1>

    <!-- Upload Section -->
    <div class="upload-section">
      <input type="file" id="file" class="upload-input" accept="image/*">
      <button id="uploadButton" class="upload-button">Upload Wallpaper</button>
      <p id="uploadStatus" class="upload-status"></p>
    </div>

    <!-- Wallpapers Gallery -->
    <div id="wallpapers" class="wallpapers-gallery"></div>

    <!-- Preview Modal -->
    <div id="previewModal" class="preview-modal">
      <div class="preview-modal-content">
        <img id="previewImage" src="" alt="Wallpaper Preview" class="preview-image">
        <div class="modal-buttons">
          <button class="close-button" onclick="closePreview()">Close</button>
          <button class="download-button" id="downloadButton">Download</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
