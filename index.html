<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallpaper Upload</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/supabase.min.js"></script>
</head>
<body>
  <div class="container">
    <h1 class="title">Upload Your Wallpapers</h1>

    <!-- Upload Section -->
    <div class="upload-section">
      <input type="file" id="file" class="upload-input" accept="image/*">
      <button id="uploadButton" class="upload-button">Upload Wallpaper</button>
      <p id="uploadStatus" class="upload-status"></p>
    </div>

    <!-- Wallpapers Gallery -->
    <div id="wallpapers" class="wallpapers-gallery"></div>

    <!-- Preview Modal -->
    <div id="previewModal" class="preview-modal">
      <div class="preview-modal-content">
        <img id="previewImage" src="" alt="Wallpaper Preview" class="preview-image">
        <div class="modal-buttons">
          <button class="close-button" onclick="closePreview()">Close</button>
          <button class="download-button" id="downloadButton">Download</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Supabase URL and key (replace with your own project details)
    const supabaseUrl = 'https://kghqkcbrxnbytmchilcj.supabase.co';
    const supabaseKey = 'your-anon-key'; // Replace with your Supabase anon key
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // DOM Elements
    const uploadButton = document.getElementById('uploadButton');
    const fileInput = document.getElementById('file');
    const uploadStatus = document.getElementById('uploadStatus');
    const wallpapersDiv = document.getElementById('wallpapers');
    const previewModal = document.getElementById('previewModal');
    const previewImage = document.getElementById('previewImage');
    const downloadButton = document.getElementById('downloadButton');

    let selectedWallpaperUrl = '';

    // Upload function to Supabase Storage
    async function uploadWallpaper() {
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select a file.');
        return;
      }

      uploadStatus.textContent = 'Uploading...';

      try {
        // Upload image to Supabase storage in 'wallpapers' folder
        const { data, error } = await supabase.storage
          .from('wallpapers')
          .upload(`public/${file.name}`, file);

        if (error) {
          throw error;
        }

        uploadStatus.textContent = 'Upload successful!';
        fetchWallpapers(); // Fetch the latest wallpapers after upload
      } catch (error) {
        uploadStatus.textContent = `Error: ${error.message}`;
      }
    }

    // Fetch and display wallpapers from Supabase
    async function fetchWallpapers() {
      const { data, error } = await supabase
        .from('wallpapers')
        .select('*');

      if (error) {
        alert('Error fetching wallpapers: ' + error.message);
        return;
      }

      wallpapersDiv.innerHTML = ''; // Clear the gallery before displaying updated list
      data.forEach(wallpaper => {
        const wallpaperElement = document.createElement('div');
        wallpaperElement.classList.add('wallpaper-card');
        wallpaperElement.innerHTML = `
          <img src="https://kghqkcbrxnbytmchilcj.supabase.co/storage/v1/object/public/wallpapers/${wallpaper.url}" class="wallpaper-image" onclick="openPreview('${wallpaper.url}')">
          <div class="wallpaper-actions">
            <button class="like-button" onclick="likeWallpaper('${wallpaper.id}')">Like</button>
            <button class="download-button" onclick="downloadWallpaper('${wallpaper.url}')">Download</button>
          </div>
        `;
        wallpapersDiv.appendChild(wallpaperElement);
      });
    }

    // Open preview modal
    function openPreview(url) {
      selectedWallpaperUrl = url;
      previewImage.src = `https://kghqkcbrxnbytmchilcj.supabase.co/storage/v1/object/public/wallpapers/${url}`;
      previewModal.classList.remove('hidden');
    }

    // Close preview modal
    function closePreview() {
      previewModal.classList.add('hidden');
    }

    // Like functionality (track likes in Supabase)
    async function likeWallpaper(wallpaperId) {
      const { data, error } = await supabase
        .from('wallpapers')
        .update({ likes: supabase.raw('likes + 1') })
        .eq('id', wallpaperId);

      if (error) {
        alert('Error liking wallpaper: ' + error.message);
      } else {
        fetchWallpapers(); // Refresh gallery
      }
    }

    // Download wallpaper and track downloads
    async function downloadWallpaper(url) {
      const { data, error } = await supabase
        .from('wallpapers')
        .update({ downloads: supabase.raw('downloads + 1') })
        .eq('url', url);

      if (error) {
        alert('Error tracking download: ' + error.message);
      }

      // Trigger download
      window.location.href = `https://kghqkcbrxnbytmchilcj.supabase.co/storage/v1/object/public/wallpapers/${url}`;
    }

    // Event listener for the upload button
    uploadButton.addEventListener('click', uploadWallpaper);

    // Load wallpapers when the page loads
    fetchWallpapers();
  </script>
</body>
</html>
