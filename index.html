<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        h1 {
            font-size: 2.5rem;
            margin-top: 20px;
            text-align: center;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .gallery-item {
            margin: 20px;
            text-align: center;
            max-width: 400px;
            position: relative;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .gallery-item button {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .gallery-item button:hover {
            background-color: #444;
        }

        .search-container {
            margin: 20px auto;
            text-align: center;
        }

        .search-container input {
            padding: 10px;
            width: 300px;
            font-size: 1rem;
        }

        .favorite-btn {
            margin-top: 5px;
            padding: 5px 10px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .favorite-btn:hover {
            background-color: #d32f2f;
        }

        .liked {
            background-color: #4CAF50;
        }

        /* Slideshow and Fullscreen Image */
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .fullscreen img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .fullscreen.show {
            visibility: visible;
            opacity: 1;
        }

        /* Animated Background */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://source.unsplash.com/random') no-repeat center center fixed;
            background-size: cover;
            z-index: -1;
            animation: backgroundAnimation 30s infinite;
        }

        @keyframes backgroundAnimation {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }

        /* Light/Dark Theme */
        body.dark-mode {
            background-color: #111;
        }

        /* Social Media Buttons */
        .social-media {
            margin-top: 20px;
        }

        .social-media button {
            padding: 10px;
            margin: 5px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .social-media button:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>
    <h1>Enhanced Image Gallery</h1>
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search by title..." onkeyup="searchImages()">
    </div>

    <div class="gallery" id="imageGallery">
        <!-- Images will be dynamically loaded here -->
    </div>

    <!-- Fullscreen Image -->
    <div class="fullscreen" id="fullscreenImage">
        <img id="fullscreenImg" src="" alt="Fullscreen Image">
    </div>

    <!-- Social Media Sharing -->
    <div class="social-media">
        <button onclick="shareOnFacebook()">Share on Facebook</button>
        <button onclick="shareOnTwitter()">Share on Twitter</button>
    </div>

    <div class="background-animation"></div>

    <script>
        const imageGallery = document.getElementById('imageGallery');
        const searchBar = document.getElementById('searchBar');
        const fullscreenImage = document.getElementById('fullscreenImage');
        const fullscreenImg = document.getElementById('fullscreenImg');

        const imageUrls = [
            { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/0a7e264631202a94c4695bc60b08eb11.png', title: 'Beautiful Mountain' },
            { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image3.png', title: 'Space Galaxy' },
            { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image2.png', title: 'City Lights' }
            { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image4.png', title: 'Space Galaxy' },
            { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image5.png', title: 'City Lights' }
            { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image6.png', title: 'Space Galaxy' },
            { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image1.png', title: 'City Lights' },
        ];

        let favorites = [];

        function displayImages(images) {
            imageGallery.innerHTML = '';
            images.forEach(image => {
                const imgContainer = document.createElement('div');
                imgContainer.classList.add('gallery-item');

                const img = document.createElement('img');
                img.src = image.url;
                img.alt = image.title;
                img.addEventListener('click', () => openFullscreen(image.url));

                const likeButton = document.createElement('button');
                likeButton.innerText = 'Like';
                likeButton.addEventListener('click', () => toggleLike(image.title));

                const downloadButton = document.createElement('button');
                downloadButton.innerText = 'Download';
                downloadButton.addEventListener('click', () => downloadImage(image.url));

                const favoriteButton = document.createElement('button');
                favoriteButton.innerText = favorites.includes(image.title) ? 'Remove from Favorites' : 'Add to Favorites';
                favoriteButton.classList.add('favorite-btn');
                favoriteButton.addEventListener('click', () => toggleFavorite(image));

                imgContainer.appendChild(img);
                imgContainer.appendChild(likeButton);
                imgContainer.appendChild(downloadButton);
                imgContainer.appendChild(favoriteButton);
                imageGallery.appendChild(imgContainer);
            });
        }

        function openFullscreen(url) {
            fullscreenImage.classList.add('show');
            fullscreenImg.src = url;
        }

        fullscreenImage.addEventListener('click', () => fullscreenImage.classList.remove('show'));

        function toggleLike(title) {
            alert(`${title} liked!`);
        }

        function downloadImage(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = url.split('/').pop();
            a.click();
        }

        function toggleFavorite(image) {
            const favoriteButton = document.getElementById(image.title);
            if (favorites.includes(image.title)) {
                favorites = favorites.filter(fav => fav !== image.title);
                favoriteButton.classList.remove('liked');
                favoriteButton.innerText = 'Add to Favorites';
            } else {
                favorites.push(image.title);
                favoriteButton.classList.add('liked');
                favoriteButton.innerText = 'Remove from Favorites';
            }
        }

        function searchImages() {
            const searchQuery = searchBar.value.toLowerCase();
            const filteredImages = imageUrls.filter(image => image.title.toLowerCase().includes(searchQuery));
            displayImages(filteredImages);
        }

        // Social media share functions
        function shareOnFacebook() {
            window.open('https://www.facebook.com/sharer/sharer.php?u=' + window.location.href, '_blank');
        }

        function shareOnTwitter() {
            window.open('https://twitter.com/intent/tweet?url=' + window.location.href, '_blank');
        }

        // Initial images display
        displayImages(imageUrls);

    </script>
</body>
</html>
