<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>8K HD WALLPAPERS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.5rem;
      margin-top: 20px;
      text-align: center;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .gallery-item {
      margin: 20px;
      text-align: center;
      max-width: 400px;
      position: relative;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    .gallery-item button {
      margin: 10px 5px 0;
      padding: 8px 12px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .gallery-item button:hover {
      background-color: #333;
    }

    .search-container {
      margin: 20px auto;
      text-align: center;
    }

    .search-container input {
      padding: 10px;
      width: 300px;
      font-size: 1rem;
    }

    .fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.4s;
      z-index: 1000;
    }

    .fullscreen.show {
      visibility: visible;
      opacity: 1;
    }

    .fullscreen img {
      max-width: 90%;
      max-height: 90%;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
    }

    .background-cosmetic {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: radial-gradient(circle, #222 0%, #111 100%);
      z-index: -2;
    }

    .cosmetic-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
      opacity: 0.08;
      z-index: -1;
    }

    .scroll-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #555;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      z-index: 999;
    }

    .scroll-top:hover {
      background: #333;
    }

    .toggle-theme {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      z-index: 99;
    }

    .view-count {
      font-size: 0.9rem;
      color: #ccc;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <button class="toggle-theme" onclick="toggleDarkMode()">🌙</button>
  <h1>8K HD WALLPAPERS</h1>

  <div class="search-container">
    <input type="text" id="searchBar" placeholder="Search by title..." onkeyup="searchImages()" />
  </div>

  <div class="gallery" id="imageGallery"></div>

  <div class="fullscreen" id="fullscreenImage">
    <span class="close-btn" onclick="closeFullscreen()">×</span>
    <img id="fullscreenImg" src="" alt="Fullscreen Image"/>
  </div>

  <button class="scroll-top" onclick="scrollToTop()">⬆</button>
  <div class="background-cosmetic"></div>
  <div class="cosmetic-overlay"></div>

  <script>
    const imageGallery = document.getElementById('imageGallery');
    const searchBar = document.getElementById('searchBar');
    const fullscreenImage = document.getElementById('fullscreenImage');
    const fullscreenImg = document.getElementById('fullscreenImg');
    const scrollTopBtn = document.querySelector('.scroll-top');

    const imageUrls = [
      { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image1.png', title: 'Red Girl' },
      { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image2.png', title: 'City View' },
      { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image3.png', title: 'Galaxy Girl' },
      { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image4.png', title: 'Shadow' },
      { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image5.png', title: 'Cyber City' },
      { url: 'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/Image6.png', title: 'Dark Night' }
    ];

    function displayImages(images) {
      imageGallery.innerHTML = '';
      images.forEach((image, i) => {
        const imgContainer = document.createElement('div');
        imgContainer.className = 'gallery-item';

        const img = document.createElement('img');
        img.src = image.url;
        img.alt = image.title;
        img.addEventListener('click', () => openFullscreen(image.url));

        const likeBtn = document.createElement('button');
        likeBtn.innerText = '❤️ Like';
        likeBtn.onclick = () => alert('You liked this image!');

        const downloadBtn = document.createElement('button');
        downloadBtn.innerText = '⬇️ Download';
        downloadBtn.onclick = () => downloadImage(image.url);

        const viewCounter = document.createElement('div');
        viewCounter.className = 'view-count';
        viewCounter.innerText = `Views: ${Math.floor(Math.random() * 1000 + 100)}`;

        imgContainer.append(img, likeBtn, downloadBtn, viewCounter);
        imageGallery.appendChild(imgContainer);
      });
    }

    function searchImages() {
      const q = searchBar.value.toLowerCase();
      const filtered = imageUrls.filter(img => img.title.toLowerCase().includes(q));
      displayImages(filtered);
    }

    function openFullscreen(url) {
      fullscreenImg.src = url;
      fullscreenImage.classList.add('show');
    }

    function closeFullscreen() {
      fullscreenImage.classList.remove('show');
    }

    function downloadImage(url) {
      const a = document.createElement('a');
      a.href = url;
      a.download = url.split('/').pop();
      a.click();
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    window.onscroll = () => {
      scrollTopBtn.style.display = window.scrollY > 100 ? 'block' : 'none';
    };

    displayImages(imageUrls);
  </script>
</body>
</html>
