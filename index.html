<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: white;
            text-align: center;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gallery-item {
            margin: 20px;
            width: 300px;
            text-align: center;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .gallery-item button {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .gallery-item button:hover {
            background-color: #444;
        }

        h1 {
            font-size: 2.5rem;
            margin-top: 20px;
        }

        .like-btn {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Image Gallery</h1>

    <div class="gallery" id="imageGallery">
        <!-- Images will be dynamically loaded here -->
    </div>

    <script>
        const imageGallery = document.getElementById('imageGallery');

        // Add URLs of multiple images
        const imageUrls = [
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/0a7e264631202a94c4695bc60b08eb11.png',
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/0a7e264631202a94c4695bc60b08eb11.png',
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/0a7e264631202a94c4695bc60b08eb11.png',  // Add more image URLs here
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/0a7e264631202a94c4695bc60b08eb11.png',   // Add more image URLs here
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/0a7e264631202a94c4695bc60b08eb11.png',
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/0a7e264631202a94c4695bc60b08eb11.png',  // Add more image URLs here
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/0a7e264631202a94c4695bc60b08eb11.png',

        ];

        // Function to handle image download
        function downloadImage(url, imageName) {
            const a = document.createElement('a');
            a.href = url;
            a.download = imageName || 'downloaded_image'; // Set a default filename if none is provided
            a.click();
        }

        // Function to handle image like
        function likeImage(imageId) {
            let likeButton = document.getElementById(imageId);
            let currentLikes = parseInt(likeButton.innerText.split(' ')[1]);
            likeButton.innerText = `Like (${currentLikes + 1})`;
        }

        // Display images dynamically
        imageUrls.forEach((url, index) => {
            const imgContainer = document.createElement('div');
            imgContainer.classList.add('gallery-item');
            
            const img = document.createElement('img');
            img.src = url;
            img.alt = 'Image';

            // Create Download Button
            const downloadButton = document.createElement('button');
            downloadButton.innerText = 'Download';
            downloadButton.addEventListener('click', () => downloadImage(url, `image${index + 1}.png`));

            // Create Like Button
            const likeButton = document.createElement('button');
            likeButton.id = `likeButton${index}`;
            likeButton.innerText = 'Like (0)';
            likeButton.classList.add('like-btn');
            likeButton.addEventListener('click', () => likeImage(`likeButton${index}`));

            // Append elements to the container
            imgContainer.appendChild(img);
            imgContainer.appendChild(downloadButton);
            imgContainer.appendChild(likeButton);
            imageGallery.appendChild(imgContainer);
        });
    </script>
</body>
</html>
