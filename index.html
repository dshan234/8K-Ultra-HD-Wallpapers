<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: white;
            text-align: center;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gallery img {
            margin: 10px;
            width: 200px; /* Adjust the width */
            height: 400px; /* Adjust the height */
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 2.5rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Image Gallery</h1>

    <div class="gallery" id="imageGallery">
        <!-- Images will be dynamically loaded here -->
    </div>

    <script>
        const imageGallery = document.getElementById('imageGallery');

        // Correct URL of the image hosted on GitHub (raw URL)
        const imageUrls = [
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/0a7e264631202a94c4695bc60b08eb11.png'
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/4f0a8b765fdba94bda5bdefb012ec5d1.png'
            'https://raw.githubusercontent.com/dshan234/8K-Ultra-HD-Wallpapers/main/1f29dc6fe676af1987020ab2c93a950a.png'


            
        ];

        // Display images dynamically
        imageUrls.forEach(url => {
            const img = document.createElement('img');
            img.src = url;
            img.alt = 'Image';
            imageGallery.appendChild(img);
        });
    </script>
</body>
</html>
