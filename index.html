<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallpaper Upload</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Upload Wallpaper</h1>

    <!-- File input (for selecting a wallpaper) -->
    <input type="file" id="file" accept="image/*">
    
    <!-- Upload button hidden from the user interface -->
    <button id="uploadButton" style="display: none;">Upload</button>

    <!-- Status message for upload progress -->
    <div id="uploadStatus"></div>

    <!-- Display gallery of uploaded wallpapers -->
    <div id="wallpapers" class="wallpapers"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    // Supabase URL and anon key (replace with your own)
    const supabaseUrl = 'https://kghqkcbrxnbytmchilcj.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnaHFrY2JyeG5ieXRtY2hpbGNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ4ODIxMDYsImV4cCI6MjA2MDQ1ODEwNn0.Ya4M9Kmmpj_zfIqyiSj6avIqpvLOeuj8b2AoTU0N6Mc';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // DOM Elements
    const uploadButton = document.getElementById('uploadButton');
    const fileInput = document.getElementById('file');
    const uploadStatus = document.getElementById('uploadStatus');
    const wallpapersDiv = document.getElementById('wallpapers');

    // Upload function to Supabase Storage
    async function uploadWallpaper() {
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select a file.');
        return;
      }

      uploadStatus.textContent = 'Uploading...';

      try {
        // Upload image to Supabase storage in 'wallpapers' folder
        const { data, error } = await supabase.storage
          .from('wallpapers')
          .upload(`public/${file.name}`, file);

        if (error) {
          console.error('Upload error:', error);
          uploadStatus.textContent = `Error: ${error.message}`;
          return;
        }

        uploadStatus.textContent = 'Upload successful!';

        // Insert metadata into the wallpapers table
        await insertWallpaperMetadata(file.name);

        // Fetch the updated list of wallpapers
        fetchWallpapers();
      } catch (error) {
        console.error('Unexpected error:', error);
        uploadStatus.textContent = `Error: ${error.message}`;
      }
    }

    // Insert wallpaper metadata into Supabase database
    async function insertWallpaperMetadata(fileName) {
      const { data, error } = await supabase
        .from('wallpapers')
        .insert([
          {
            url: fileName, // The filename in Supabase Storage
            likes: 0,      // Initial like count
            downloads: 0,  // Initial download count
          }
        ]);

      if (error) {
        alert('Error inserting metadata: ' + error.message);
      }
    }

    // Fetch and display wallpapers from Supabase
    async function fetchWallpapers() {
      const { data, error } = await supabase
        .from('wallpapers')
        .select('*');

      if (error) {
        alert('Error fetching wallpapers: ' + error.message);
        return;
      }

      wallpapersDiv.innerHTML = ''; // Clear the gallery before displaying updated list
      data.forEach(wallpaper => {
        const wallpaperElement = document.createElement('div');
        wallpaperElement.classList.add('wallpaper-card');
        wallpaperElement.innerHTML = `
          <img src="https://kghqkcbrxnbytmchilcj.supabase.co/storage/v1/object/public/wallpapers/${wallpaper.url}" class="wallpaper-image">
          <div class="wallpaper-actions">
            <button class="like-button" onclick="likeWallpaper('${wallpaper.id}')">Like</button>
            <button class="download-button" onclick="downloadWallpaper('${wallpaper.url}')">Download</button>
          </div>
        `;
        wallpapersDiv.appendChild(wallpaperElement);
      });
    }

    // Like functionality (track likes in Supabase)
    async function likeWallpaper(wallpaperId) {
      const { data, error } = await supabase
        .from('wallpapers')
        .update({ likes: supabase.raw('likes + 1') })
        .eq('id', wallpaperId);

      if (error) {
        alert('Error liking wallpaper: ' + error.message);
      } else {
        fetchWallpapers(); // Refresh gallery
      }
    }

    // Download wallpaper and track downloads
    async function downloadWallpaper(url) {
      const { data, error } = await supabase
        .from('wallpapers')
        .update({ downloads: supabase.raw('downloads + 1') })
        .eq('url', url);

      if (error) {
        alert('Error tracking download: ' + error.message);
      }

      // Trigger download
      window.location.href = `https://kghqkcbrxnbytmchilcj.supabase.co/storage/v1/object/public/wallpapers/${url}`;
    }

    // Load wallpapers when the page loads
    fetchWallpapers();
  </script>
</body>
</html>
